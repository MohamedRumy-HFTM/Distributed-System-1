# OpenAPI-Metadaten fuer /q/openapi und die Swagger UI.
# Bewusst KEINE quarkus.datasource.* Eintraege: sobald eine JDBC-URL gesetzt ist,
# gilt die Datenquelle als extern konfiguriert und die Dev Services starten nicht mehr.
quarkus.smallrye-openapi.info-title=Blog API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=REST-Schnittstelle fuer Blogs und deren Kommentare

# CORS: nur die Dev-Server der ueblichen Frontend-Toolchains sind erlaubt.
# Absichtlich KEIN Wildcard "*": damit koennte jede fremde Seite im Browser des
# Nutzers Requests an diese API stellen. Produktive Origins gehoeren spaeter per
# Umgebungsvariable gesetzt, nicht hier eincheckt.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE
# Authorization muss durch, sonst scheitert jeder Preflight auf einen
# geschuetzten Endpunkt.
quarkus.http.cors.headers=Content-Type,Authorization
# Das Token kommt im Authorization-Header, nicht als Cookie - keine Credentials.
quarkus.http.cors.access-control-allow-credentials=false

# --- OIDC / Keycloak -------------------------------------------------------
# Variante A (Standard): Dev Services starten Keycloak selbst und importieren
# denselben Realm, den auch der eigene Container nutzt - eine Quelle fuer beide.
quarkus.oidc.client-id=blog-api
quarkus.oidc.application-type=service
quarkus.keycloak.devservices.realm-path=keycloak/realm-blog.json

# Swagger UI soll einen Authorize-Knopf fuer das Bearer-Token zeigen. Explizit
# gesetzt, damit der Name stabil ist und die README darauf verweisen kann.
quarkus.smallrye-openapi.security-scheme=jwt
quarkus.smallrye-openapi.security-scheme-name=bearerAuth

# Variante B: eigener Container aus docker-compose.yml.
# Start mit: ./mvnw quarkus:dev -Dquarkus.profile=keycloak
%keycloak.quarkus.oidc.auth-server-url=http://localhost:8180/realms/blog
%keycloak.quarkus.keycloak.devservices.enabled=false

# Tests brauchen kein Keycloak: @TestSecurity setzt die Identitaet direkt.
# Spart pro Lauf einen Container und macht die Tests unabhaengig vom Netz.
%test.quarkus.oidc.enabled=false
%test.quarkus.keycloak.devservices.enabled=false
